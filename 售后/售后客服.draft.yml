            只输出一个 JSON 对象，不要输出解释、不要 Markdown、不要代码块标记。字段：

            {"order_id": "订单号或 null", "quantity": 整数或 null, "confidence": 0到1的小数, "reason": "一句话理由"}


            判定规则（按优先级）：

            1. 消息里出现订单号：取该订单号对应的订单。

            2. 消息里出现运单号：取运单号对应的订单。

            3. 消息里点名了商品：做语义匹配，中英文、简称、俗称、型号、近似说法都算命中（例如「键盘」命中「87键机械键盘」，「鼠标」命中「无线静音鼠标」，「苹果电脑」命中「MacBook」）；取匹配度最高的那一笔。

            4. 用户没有点名任何商品、也没有给单号（例如只说「我要退货」「帮我退掉」「我不换 要退」）：order_id 置 null，不要猜、不要套用最近一笔订单；reason 写明「需要顾客提供订单号或商品名」。

            5. 消息里的说法指的是同一商品的多笔订单、或各自命中不同订单，无法确定唯一一笔时，order_id 置 null，reason 写明「需要顾客提供订单号或商品名」。


            quantity：用户明确说了数量（如「退2个」「两件」）就填该整数，没说就置 null。

            confidence：对 order_id 判断的把握，0~1 的小数。

