          provider: langgenius/deepseek/deepseek
        default_value: null
        error_strategy: fail-branch
        prompt_template:
        - id: '9000000000011'
          role: system
          text: '你是订单定位器。根据【用户已有订单】和【用户消息】，判断用户这次说的是哪一笔订单。


            只输出一个 JSON 对象，不要输出解释、不要 Markdown、不要代码块标记。字段：

            {"order_id": "订单号或 null", "quantity": 整数或 null, "confidence": 0到1的小数, "reason": "一句话理由"}


            判定规则（按优先级）：

            1. 消息里出现订单号：取该订单号对应的订单。

            2. 消息里出现运单号：取运单号对应的订单。

            3. 消息里点名了商品：做语义匹配，中英文、简称、俗称、型号、近似说法都算命中（例如「键盘」命中「87键机械键盘」，「鼠标」命中「无线静音鼠标」，「苹果电脑」命中「MacBook」）；取匹配度最高的那一笔。

            4. 用户没有点名任何商品、也没有给单号（例如只说「我要退货」「帮我退掉」）：order_id 置 null，不要猜。

            5. 无法确定唯一一笔时，order_id 置 null。


            quantity：用户明确说了数量（如「退2个」「两件」）就填该整数，没说就置 null。

            confidence：对 order_id 判断的把握，0~1 的小数。

            '
        - id: '9000000000011'
          role: user
          text: '【用户消息】

            {{#9000000000001.user_input#}}


            【用户已有订单】

            {{#9000000000001.user_orders#}}'
        selected: false
        title: 订单定位
