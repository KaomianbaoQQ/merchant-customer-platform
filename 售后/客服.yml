               - *_id 为记录 ID（订单号/编号等）。用户明确给出编号时，必须把编号原样写入对应操作的 *_id，严禁丢失，这是最重要的一条。
               - *_goodsname 为商品名称，只填商品本身（如"电脑"、"手机"），不要包含"订单"等词。
            5. 用户一次给出多个编号时（如"X1、X2、X3"），合并写进同一个操作的 *_id，用英文逗号连接，例如 "X1,X2,X3"。
            6. 模糊指代规则（只能从下方"该用户已有订单"里取，禁止编造）："最新/最近/刚才那个/上一个" = "序号"为 1 那条的 id；"最早/最旧" = "序号"最大那条的 id；select 的"我的订单"没指明具体 = *_id 填 null（null 表示查询本人全部订单）；delete/update 泛泛说"我的订单" = *_id 填 null，明确说"全部/所有/都"才填全部 id 用英文逗号连接；若只出现"它/这个/那个/这些"等代词且无任何线索 = *_id 填 null，绝不猜测。
