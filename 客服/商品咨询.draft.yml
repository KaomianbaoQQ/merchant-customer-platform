        classes:
        - name: 用户询问单个商品的参数、规格、材质、价格、使用方法、售后、库存、发货、功能、卖点、商品详情等
          id: '1'
          label: 商品咨询
        - name: 用户同时提及2款及以上商品，要求对比参数、优缺点、价格、性能，询问哪个更适合、怎么选
          id: '1789113737718'
          label: 商品对比
        - name: 用户消息和商品、业务无关，是问候、日常聊天、情绪对话、无关问题
          id: '2'
          label: 闲聊
        - name: 用户询问自己订单的物流进度、快递到哪了、什么时候送到、是否已发货或已签收、运单号等物流问题
          id: '3'
          label: 物流查询
        title: 问题分类器
        query_variable_selector:
        - '1789112579152'
        - user_input
        type: question-classifier
        vision:
          enabled: false
        instruction: '你是意图分类器。请判断用户消息属于哪一类，严格按下述定义：

          - 商品咨询：只要用户消息涉及任何商品、货物、物品的询问（包括参数、规格、材质、价格、产地、寿命、使用方法、售后、库存、发货、功能、卖点、商品详情等），即使只提到某个商品名称或问它的任何信息，也一律归为「商品咨询」。

          - 商品对比：用户同时提及 2 款及以上商品，要求对比参数、优缺点、价格、性能，或询问哪个更适合、怎么选。

          - 闲聊：用户消息与商品、业务完全无关，例如问候、自我介绍、日常聊天、情绪表达、与商品无关的常识或闲聊。

          判定优先级：商品咨询 > 商品对比 > 闲聊。只要可能涉及任何商品，就归为商品咨询，不要归为闲聊。

          - 物流查询：用户询问自己订单的物流进度、快递/包裹到哪了、什么时候送到、是否已发货或已签收、运单号是多少等物流相关问题。

          判定优先级：物流查询 > 商品咨询 > 商品对比 > 闲聊。只要用户在问物流 / 快递 / 发货 / 签收 / 运单号，即使提到了商品，也一律归为「物流查询」。'
        model:
          name: deepseek-v4-flash
          provider: langgenius/deepseek/deepseek
          completion_params:
            temperature: 0
          mode: chat
