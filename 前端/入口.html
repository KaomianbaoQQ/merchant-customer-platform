<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kaomianbao 商城 · 统一入口</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #eef1f8, #dfe5f3); color: #1f2330;
    display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 20px;
  }
  h1 { margin: 0 0 6px; font-size: 26px; }
  .sub { color: #6b7488; font-size: 14px; margin-bottom: 30px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 18px; width: min(880px, 100%); }
  a.card {
    display: block; text-decoration: none; color: inherit; background: #fff; border-radius: 16px;
    padding: 24px 22px; box-shadow: 0 6px 24px rgba(30,40,80,.08); transition: transform .16s, box-shadow .16s;
    border: 1px solid #e8ecf6;
  }
  a.card:hover { transform: translateY(-3px); box-shadow: 0 12px 32px rgba(30,40,80,.16); }
  .ico { font-size: 30px; }
  .card h2 { margin: 10px 0 6px; font-size: 17px; }
  .card p { margin: 0; color: #6b7488; font-size: 13px; line-height: 1.7; }
  .path { margin-top: 12px; font-size: 12px; color: #4b6cf5; font-family: ui-monospace, Menlo, monospace; }
  footer { margin-top: 28px; color: #8b94a8; font-size: 12px; text-align: center; line-height: 1.8; }
  .warn {
    margin-top: 18px; padding: 12px 16px; border-radius: 10px; font-size: 12.5px; line-height: 1.7;
    background: #fff4f4; border: 1px solid #ffd6d6; color: #b3261e; display: none; width: min(880px, 100%);
  }
  .warn.show { display: block; }
  .warn code { font-family: ui-monospace, Menlo, monospace; }
</style>
</head>
<body>
  <h1>Kaomianbao 商城</h1>
  <div class="sub">三个前端互相独立、共用一个后端，点下面任意一个即可进入</div>

  <div class="grid">
    <a class="card" href="javascript:void(0)" onclick="go('/')">
      <div class="ico">🛍️</div>
      <h2>顾客商城</h2>
      <p>浏览商品、下单、支付、评价；商品详情左下角咨询售前客服，右下角是售后客服（订单 / 物流 / 退换）。</p>
      <div class="path" id="p1">/</div>
    </a>
    <a class="card" href="javascript:void(0)" onclick="go('/merchant')">
      <div class="ico">🏪</div>
      <h2>商家后台</h2>
      <p>商家注册登录、上架商品、查看订单与销量、发货、处理售后、回复顾客消息。</p>
      <div class="path" id="p2">/merchant</div>
    </a>
    <a class="card" href="javascript:void(0)" onclick="go('/platform')">
      <div class="ico">🛡️</div>
      <h2>平台管理</h2>
      <p>管理员处理仲裁、停用 / 恢复商家、禁言、罚款、下架商品、查看顾客与全部对话、直接和商家沟通。</p>
      <div class="path" id="p3">/platform</div>
    </a>
  </div>

  <div class="warn" id="warn"></div>

  <footer>
    平台管理员默认账号：admin　密码：12345<br />
    双击项目根目录的「启动.command」即可一键启动后端并打开本页
  </footer>

<script>
/* 后端地址：
   - 由后端页面（http/https）打开时用同源；
   - 直接双击本文件（file://）时无法用根路径跳转，自动指向 127.0.0.1:8000，
     也可用 ?api=http://127.0.0.1:8001 指定其他端口。 */
const BASE = (function(){
  if (location.protocol !== 'file:') return '';
  try {
    const q = new URLSearchParams(location.search).get('api');
    if (q) return q.replace(/\/+$/, '');
  } catch (e) {}
  return 'http://127.0.0.1:8000';
})();

function go(path){
  location.href = BASE + path;
}

/* 把实际地址显示到卡片上，便于确认跳去哪里 */
['/','/merchant','/platform'].forEach(function(p, i){
  const el = document.getElementById('p' + (i + 1));
  if (el) el.textContent = BASE + p;
});

/* 直接双击打开（file://）时先探一下后端在不在，不在就给出明确提示 */
if (location.protocol === 'file:') {
  fetch(BASE + '/api/health')
    .then(function(r){ if (!r.ok) throw new Error(); })
    .catch(function(){
      const w = document.getElementById('warn');
      w.innerHTML = '⚠️ 连不上后端服务（' + BASE + '）。请先双击项目根目录的「启动.command」启动后端，再点上面的卡片；' +
                    '若后端跑在别的端口，用 <code>入口.html?api=http://127.0.0.1:端口</code> 打开。';
      w.classList.add('show');
    });
}
</script>
</body>
</html>
