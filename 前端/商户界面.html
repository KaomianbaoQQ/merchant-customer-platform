<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>测试商城商户中心</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230071e3'/%3E%3Ctext x='32' y='42' font-size='30' font-family='-apple-system,sans-serif' font-weight='700' fill='%23fff' text-anchor='middle'%3EK%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --bg:#ffffff;
    --bg-soft:#f5f5f7;
    --ink:#1d1d1f;
    --ink-2:#6e6e73;
    --ink-3:#86868b;
    --line:#d2d2d7;
    --line-soft:#e8e8ed;
    --blue:#0071e3;
    --blue-hover:#0077ed;
    --green:#34c759;
    --orange:#ff9500;
    --red:#ff3b30;
    --radius:14px;
    --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.5;font-size:14px;
    -webkit-font-smoothing:antialiased;
  }
  a{color:var(--blue);text-decoration:none;}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
  input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink);}
  /* ===== 顶部导航 ===== */
  .nav{
    position:sticky;top:0;z-index:50;
    background:rgba(255,255,255,.82);backdrop-filter:saturate(180%) blur(20px);
    border-bottom:1px solid var(--line-soft);
  }
  .nav-inner{max-width:1080px;margin:0 auto;padding:0 24px;height:56px;display:flex;align-items:center;gap:20px;}
  .nav-logo{font-size:17px;font-weight:700;letter-spacing:-.02em;}
  .nav-logo .dot{color:var(--blue);}
  .nav-sub{margin-left:8px;font-size:13px;color:var(--ink-2);font-weight:400;}
  .nav-tabs{display:flex;gap:4px;margin-left:14px;}
  .nav-tab{
    padding:7px 14px;border-radius:980px;font-size:13.5px;color:var(--ink-2);transition:all .2s;
  }
  .nav-tab:hover{background:var(--bg-soft);color:var(--ink);}
  .nav-tab.active{background:var(--ink);color:#fff;}
  .nav-tab .badge{
    display:inline-block;min-width:16px;height:16px;line-height:16px;padding:0 4px;margin-left:6px;
    border-radius:980px;background:var(--red);color:#fff;font-size:11px;text-align:center;
  }
  .nav-right{margin-left:auto;display:flex;align-items:center;gap:10px;}
  .nav-badge{
    font-size:12px;color:var(--ink-2);background:var(--bg-soft);
    padding:5px 12px;border-radius:980px;border:1px solid var(--line-soft);
  }
  .nav-badge i{font-style:normal;color:var(--green);font-weight:600;}
  /* ===== 主区域 ===== */
  .main{max-width:1080px;margin:0 auto;padding:28px 24px 80px;}
  .view{display:none;}
  .view.active{display:block;}
  .page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;}
  .page-head h1{font-size:28px;font-weight:700;letter-spacing:-.03em;}
  .page-head p{color:var(--ink-2);font-size:14px;margin-top:4px;}
  .head-actions{display:flex;gap:10px;flex-wrap:wrap;}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    padding:9px 18px;border-radius:980px;font-size:14px;font-weight:500;
    transition:all .2s;border:1px solid transparent;white-space:nowrap;
  }
  .btn-primary{background:var(--blue);color:#fff;}
  .btn-primary:hover{background:var(--blue-hover);}
  .btn-primary:disabled{opacity:.5;cursor:not-allowed;}
  .btn-ghost{color:var(--blue);background:transparent;}
  .btn-ghost:hover{background:#f0f7ff;}
  .btn-light{background:#fff;border-color:var(--line);color:var(--ink);}
  .btn-light:hover{border-color:var(--ink-3);}
  .btn-danger{color:var(--red);}
  .btn-danger:hover{background:#fff0ef;}
  .btn-sm{padding:5px 12px;font-size:12.5px;}
  .btn .spin{display:none;width:13px;height:13px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:rot .7s linear infinite;}
  .btn.loading .spin{display:inline-block;}
  .btn.loading .lbl{opacity:.85;}
  @keyframes rot{to{transform:rotate(360deg);}}
  /* ===== 工具栏 ===== */
  .toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:24px;}
  .search{
    flex:1;min-width:220px;display:flex;align-items:center;gap:8px;
    background:var(--bg-soft);border-radius:12px;padding:9px 14px;
    border:1px solid transparent;transition:all .2s;
  }
  .search:focus-within{border-color:var(--blue);background:#fff;box-shadow:0 0 0 4px rgba(0,113,227,.12);}
  .search svg{flex:none;color:var(--ink-3);}
  .search input{border:none;outline:none;background:none;flex:1;font-size:14px;}
  .filter-group{display:flex;gap:6px;flex-wrap:wrap;}
  .chip{
    padding:7px 14px;border-radius:980px;border:1px solid var(--line);
    background:#fff;color:var(--ink-2);font-size:13px;transition:all .2s;
  }
  .chip:hover{border-color:var(--blue);color:var(--blue);}
  .chip.active{background:var(--ink);border-color:var(--ink);color:#fff;}
  /* ===== 商品列表 ===== */
  .list{margin-top:18px;display:flex;flex-direction:column;gap:10px;}
  .row{
    display:flex;align-items:center;gap:16px;
    background:#fff;border:1px solid var(--line-soft);border-radius:var(--radius);
    padding:14px 18px;transition:box-shadow .2s,border-color .2s;
  }
  .row:hover{box-shadow:var(--shadow);border-color:var(--line);}
  .row .thumb{
    width:56px;height:56px;border-radius:12px;background:var(--bg-soft);
    display:flex;align-items:center;justify-content:center;overflow:hidden;flex:none;
    border:1px solid var(--line-soft);
  }
  .row .thumb img{width:100%;height:100%;object-fit:cover;}
  .row .thumb .ph{color:var(--ink-3);font-size:20px;font-weight:600;}
  .row .info{flex:1;min-width:0;}
  .row .info .name{font-size:15px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .row .info .meta{font-size:12.5px;color:var(--ink-2);margin-top:2px;}
  .row .price{font-size:15px;font-weight:600;white-space:nowrap;}
  .row .price small{color:var(--ink-3);font-weight:400;font-size:12px;}
  .row .ops{display:flex;gap:4px;flex:none;}
  .empty{
    margin-top:18px;padding:60px 20px;text-align:center;color:var(--ink-3);
    background:var(--bg-soft);border-radius:20px;border:1px dashed var(--line);
  }
  .empty .t{font-size:15px;color:var(--ink-2);margin-bottom:4px;}
  /* ===== 平台管控提示 / 余额 ===== */
  .merchant-notice{background:#fff3e0;color:#a15c00;border:1px solid #ffd08a;
    border-radius:10px;padding:8px 12px;margin:8px 14px;font-size:13px;font-weight:600;}
  .merchant-notice.disabled{background:#fdeceb;color:#b3261e;border-color:#f6b7b2;}
  .chat-input-muted{color:#a15c00;background:#fff8ee;border:1px dashed #ffd08a;
    border-radius:10px;padding:12px;font-size:13px;text-align:center;}
  /* ===== 顾客洞察 ===== */
  .muted{color:var(--ink-3);font-size:12px;}
  .tag{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;
    background:var(--bg-soft);color:var(--ink-2);margin:1px 2px 0 0;}
  .tag.ok{background:#e8f7ee;color:#1f8a4c;}
  /* ===== 编辑抽屉 ===== */
  .drawer-mask{position:fixed;inset:0;background:rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:opacity .25s;z-index:90;}
  .drawer-mask.open{opacity:1;pointer-events:auto;}
  .drawer{
    position:fixed;top:0;right:0;bottom:0;width:560px;max-width:100vw;
    background:#fff;z-index:100;transform:translateX(100%);
    transition:transform .3s cubic-bezier(.4,0,.2,1);
    display:flex;flex-direction:column;box-shadow:-12px 0 40px rgba(0,0,0,.12);
  }
  .drawer.open{transform:translateX(0);}
  .drawer-head{
    display:flex;align-items:center;justify-content:space-between;
    padding:18px 24px;border-bottom:1px solid var(--line-soft);
  }
  .drawer-head h2{font-size:18px;font-weight:700;letter-spacing:-.02em;}
  .drawer-body{flex:1;overflow-y:auto;padding:22px 24px 30px;}
  .drawer-foot{
    padding:16px 24px;border-top:1px solid var(--line-soft);
    display:flex;justify-content:flex-end;gap:10px;background:#fff;
  }
  .field{margin-bottom:18px;}
  .field label{display:block;font-size:13px;font-weight:600;color:var(--ink);margin-bottom:6px;}
  .field label .req{color:var(--red);}
  .field .hint{font-size:12px;color:var(--ink-3);margin-top:6px;}
  .inp{
    width:100%;padding:10px 14px;border-radius:12px;border:1px solid var(--line);
    background:#fff;outline:none;transition:border .2s,box-shadow .2s;
  }
  .inp:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(0,113,227,.12);}
  textarea.inp{resize:vertical;min-height:84px;line-height:1.55;}
  .field-row{display:flex;gap:12px;}
  .field-row .field{flex:1;}
  /* 库存管理抽屉 */
  .inv-row{border:1px solid var(--line-soft);border-radius:14px;padding:14px 16px;margin-bottom:12px;
           background:#fff;}
  .inv-head{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;}
  .inv-name{font-size:15px;font-weight:600;color:var(--ink);}
  .inv-name small{color:var(--ink-3);font-weight:500;margin-left:4px;}
  .inv-stats{font-size:12px;color:var(--ink-3);}
  .inv-edit{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .inv-input{width:140px;flex:none;}
  /* 图片九宫格 */
  .img-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
  .img-cell{
    position:relative;aspect-ratio:1/1;border-radius:12px;overflow:hidden;
    border:1px solid var(--line-soft);background:var(--bg-soft);
  }
  .img-cell img{width:100%;height:100%;object-fit:cover;display:block;}
  .img-cell .rm{
    position:absolute;top:5px;right:5px;width:22px;height:22px;border-radius:50%;
    background:rgba(0,0,0,.55);color:#fff;font-size:14px;line-height:22px;text-align:center;
    display:flex;align-items:center;justify-content:center;
  }
  .img-cell .rm:hover{background:var(--red);}
  .img-cell .first{
    position:absolute;left:5px;bottom:5px;font-size:10px;background:var(--blue);color:#fff;
    padding:1px 6px;border-radius:6px;
  }
  .img-add{
    aspect-ratio:1/1;border-radius:12px;border:1.5px dashed var(--line);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    color:var(--ink-3);background:var(--bg-soft);transition:all .2s;cursor:pointer;
  }
  .img-add:hover,.img-add.drag{border-color:var(--blue);background:#f0f7ff;color:var(--blue);}
  .img-add .plus{font-size:22px;line-height:1;}
  .img-add .tip{font-size:11px;}
  .spec-item{display:flex;gap:8px;margin-bottom:8px;align-items:center;}
  .spec-item .inp-k{flex:0 0 34%;}
  .spec-item .inp-v{flex:1;}
  .spec-item .del{
    flex:none;width:30px;height:30px;border-radius:8px;color:var(--ink-3);
    display:flex;align-items:center;justify-content:center;font-size:16px;transition:all .2s;
  }
  .spec-item .del:hover{background:#fff0ef;color:var(--red);}
  .spec-add{
    margin-top:2px;font-size:13px;color:var(--blue);padding:6px 10px;border-radius:8px;
  }
  .spec-add:hover{background:#f0f7ff;}
  /* ===== 顾客消息 ===== */
  .chat-wrap{
    margin-top:20px;display:grid;grid-template-columns:300px 1fr;gap:14px;
    height:calc(100vh - 210px);min-height:460px;
  }
  .chat-list{
    background:#fff;border:1px solid var(--line-soft);border-radius:var(--radius);
    overflow-y:auto;display:flex;flex-direction:column;
  }
  /* 聊天记录查询（关键词 + 时间范围） */
  .chat-search{display:flex;gap:10px;align-items:center;margin-bottom:8px;flex-wrap:wrap;}
  .chat-search input{
    flex:1;min-width:200px;padding:10px 12px;border:1px solid var(--line);
    border-radius:10px;font-size:13.5px;font-family:inherit;outline:none;
  }
  .chat-search input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,113,227,.12);}
  .chat-search select{
    padding:10px 12px;border:1px solid var(--line);border-radius:10px;
    font-size:13.5px;font-family:inherit;background:#fff;outline:none;
  }
  .chat-search-tip{font-size:12.5px;color:var(--ink-3);margin-bottom:8px;min-height:16px;}
  .conv .c-match{font-size:12px;color:var(--ink-3);margin-top:4px;word-break:break-word;}
  .conv{
    padding:13px 16px;border-bottom:1px solid var(--line-soft);cursor:pointer;transition:background .15s;
    display:flex;flex-direction:column;gap:3px;
  }
  .conv:hover{background:var(--bg-soft);}
  .conv.active{background:#f0f7ff;}
  .conv.need-human{background:#fff8ec;box-shadow:inset 3px 0 0 var(--orange);animation:needBlink 1.2s ease-in-out infinite;}
  .conv.need-human:hover{background:#fff3db;}
  
  .alert-banner{
    display:none;margin:0 0 16px;padding:12px 16px;border-radius:12px;cursor:pointer;
    background:linear-gradient(90deg,#fff1f0,#ffe6e3);border:1px solid #ffc4bd;
    color:#b3261e;font-size:14px;font-weight:600;
    animation:alertPulse 1.3s ease-in-out infinite;
  }
  .alert-banner.show{display:block;}
  
  .alert-banner.calm{
    animation:none;background:#f5f7fb;border-color:#e3e8f0;color:#5b6577;cursor:default;
  }
  .alert-banner.calm .sub{color:#8b95a7;}
  .alert-banner .sub{display:block;margin-top:3px;font-size:12.5px;font-weight:400;color:#8a4b46;}
  @keyframes alertPulse{
    0%,100%{box-shadow:0 0 0 0 rgba(255,77,79,.38);}
    50%{box-shadow:0 0 0 8px rgba(255,77,79,0);}
  }
  @keyframes needBlink{
    0%,100%{background:#fff8ec;}
    50%{background:#ffe7c4;}
  }
  .conv .c-need{
    display:inline-block;font-size:10px;font-weight:600;color:#b45309;
    background:#fde9cd;border-radius:5px;padding:0 5px;margin-left:6px;vertical-align:1px;
  }
  .conv .c-need-done{color:#5b6577;background:#eceff5;}
  /* 顾客来消息、商家尚未真人回复：左侧红条提醒及时回复 */
  .conv.need-reply:not(.need-human){box-shadow:inset 3px 0 0 var(--red);}
  .conv.need-reply:not(.need-human):hover{background:#fff5f4;}
  /* 退换货 / 退款意向标签 */
  .conv .c-need.c-return{color:#b3261e;background:#ffe3df;}
  .conv .c-need.c-return-done{color:#8a6d3b;background:#f6efe0;}
  .conv .c-top{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .conv .c-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .conv .c-tag{
    display:inline-block;font-size:10px;font-weight:500;color:var(--blue);
    background:#eef5ff;border-radius:5px;padding:0 5px;margin-right:5px;vertical-align:1px;
  }
  .conv .c-time{font-size:11px;color:var(--ink-3);flex:none;}
  .conv .c-last{font-size:12.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .conv .c-unread{
    flex:none;min-width:18px;height:18px;line-height:18px;padding:0 5px;border-radius:980px;
    background:var(--red);color:#fff;font-size:11px;text-align:center;
  }
  .chat-main{
    background:#fff;border:1px solid var(--line-soft);border-radius:var(--radius);
    display:flex;flex-direction:column;overflow:hidden;
  }
  .chat-head{
    padding:14px 20px;border-bottom:1px solid var(--line-soft);
    display:flex;align-items:center;justify-content:space-between;gap:10px;
  }
  .chat-head .who{font-size:15px;font-weight:600;}
  .chat-head .sub{font-size:12px;color:var(--ink-3);margin-top:1px;}
  /* 会话内退换货意向提醒条（会持续显示，直到商家「标记已处理」） */
  .chat-intent-tip{
    margin:10px 16px 0;padding:11px 14px;border-radius:10px;
    background:#fff1f0;border:1px solid #ffc4bd;color:#b3261e;
    font-size:14px;font-weight:700;line-height:1.5;
  }
  .chat-intent-tip.pending{animation:alertPulse 1.3s ease-in-out infinite;}
  .chat-intent-tip span{display:block;margin-top:3px;font-size:12.5px;font-weight:400;color:#8a4b46;}
  .chat-intent-tip .co-resolve{
    margin-top:8px;float:right;padding:5px 12px;border-radius:8px;border:1px solid #ffc4bd;
    background:#fff;color:#b3261e;font-size:12.5px;font-weight:600;cursor:pointer;
  }
  .chat-intent-tip .co-resolve:hover{background:#ffe9e7;}
  .chat-msgs{flex:1;overflow-y:auto;padding:18px 20px;display:flex;flex-direction:column;gap:10px;background:var(--bg-soft);overscroll-behavior:contain;-webkit-overflow-scrolling:touch;}
  .msg{max-width:72%;padding:9px 13px;border-radius:14px;font-size:13.5px;line-height:1.5;word-break:break-word;white-space:pre-wrap;}
  .msg.user{align-self:flex-start;background:#fff;border:1px solid var(--line-soft);border-bottom-left-radius:4px;}
  /* 消息后面的「已读 / 未读」小字 */
  .msg-read{font-size:10.5px;margin-left:6px;opacity:.6;white-space:nowrap;}
  .msg.merchant{align-self:flex-end;background:var(--blue);color:#fff;border-bottom-right-radius:4px;}
  .msg.bot{align-self:flex-start;background:#eef4ff;border:1px solid rgba(0,113,227,.18);border-bottom-left-radius:4px;color:var(--ink-1);}
  .msg .t{display:block;font-size:10.5px;opacity:.6;margin-top:3px;}
  .chat-msg-imgs{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;}
  .chat-msg-imgs img{width:88px;height:88px;object-fit:cover;border-radius:8px;border:1px solid rgba(0,0,0,.08);cursor:zoom-in;background:#f3f5f9;display:block;}
  .chat-input{display:flex;gap:10px;padding:14px 16px;border-top:1px solid var(--line-soft);background:#fff;}
  .chat-input input{
    flex:1;padding:10px 14px;border-radius:12px;border:1px solid var(--line);outline:none;
  }
  .chat-input input:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(0,113,227,.12);}
  .chat-placeholder{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    color:var(--ink-3);gap:6px;
  }
  .chat-placeholder .big{font-size:34px;}
  
  .stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:8px;}
  .stat-card{background:var(--bg-soft);border:1px solid var(--line-soft);border-radius:12px;padding:12px 14px;}
  .stat-card .k{font-size:12px;color:var(--ink-2);}
  .stat-card .v{font-size:20px;font-weight:700;letter-spacing:-.02em;margin-top:2px;}
  .stats-h3{font-size:14px;font-weight:600;margin:20px 0 10px;}
  .buyer{border:1px solid var(--line-soft);border-radius:12px;padding:12px 14px;margin-bottom:10px;}
  .buyer-head{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .buyer-name{font-size:14px;font-weight:600;}
  .buyer-meta{font-size:12px;color:var(--ink-2);}
  .b-order{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2);padding:8px 0;border-top:1px solid var(--line-soft);margin-top:8px;}
  .logi-card{margin-top:14px;background:#fff;border:1px solid var(--line-soft);border-radius:var(--radius);padding:16px 18px;}
  .logi-card .row-line{display:flex;justify-content:space-between;gap:12px;font-size:13px;padding:5px 0;}
  .logi-card .row-line .k{color:var(--ink-2);}
  .steps{display:flex;gap:6px;margin-top:14px;}
  .steps .s{flex:1;text-align:center;font-size:11px;color:var(--ink-3);}
  .steps .s .bar{height:4px;border-radius:4px;background:var(--line);margin-bottom:6px;}
  .steps .s.done .bar{background:var(--blue);}
  .steps .s.done{color:var(--blue);}
  .steps .s.cur .bar{background:var(--green);}
  .steps .s.cur{color:var(--green);font-weight:600;}

<script>

const API_ORIGIN = (function(){
  if (location.protocol !== 'file:') return '';
  try {
    const q = new URLSearchParams(location.search).get('api');
    if (q) return q.replace(/\/+$/, '');
  } catch (e) {}
  return 'http://127.0.0.1:8000';
})();
const API = API_ORIGIN + '/api/merchant';
const TOKEN_KEY = 'testmall_merchant_token';
let token = '';
let merchant = null;
let products = [];
let categories = [];
let currentCat = '';
let editingId = null;
let editingImages = [];     // 正在编辑的商品图片文件名数组
let uploading = 0;
let conversations = [];
let chatSearching = false;   
let activeChat = null;      
let chatTimer = null;
let unreadTimer = null;
let refunds = [];
let refundTimer = null;
let merchantOrders = [];
let orderFilter = '';
let orderTimer = null;
let chatOrdersSig = '';
let chatOrdersData = [];    
let statsProductId = null;
let authTab = 'login';

function $(id){ return document.getElementById(id); }
function getToken(){
  try { return localStorage.getItem(TOKEN_KEY) || ''; } catch (e) { return ''; }
}
function setToken(t){
  token = t || '';
  try {
    if (token) localStorage.setItem(TOKEN_KEY, token);
    else localStorage.removeItem(TOKEN_KEY);
  } catch (e) {}
}
async function api(method, path, body){
  const opt = { method, headers: {} };
  if (token) opt.headers['Authorization'] = 'Bearer ' + token;
  if (body !== undefined){
    opt.headers['Content-Type'] = 'application/json';
    opt.body = JSON.stringify(body);
  }
  let res;
  try {
    res = await fetch(API + path, opt);
  } catch (e) {
    throw new Error(networkHint());
  }
  const data = await res.json().catch(() => ({}));
  if (res.status === 401){
    setToken('');
    showAuth();
    throw new Error(data.error || '请先登录');
  }
  if (!res.ok || data.ok === false){
    throw new Error(data.error || data.message || ('请求失败 ' + res.status));
  }
  return data;
}

function networkHint(){
  if (location.protocol === 'file:'){
    return '无法连接后端 ' + API_ORIGIN + '。你正在用本地文件方式打开（file://），' +
      'Safari 等浏览器会拦截这类请求。请改用 ' + API_ORIGIN + '/merchant 打开本页。';
  }
  return '无法连接后端服务（' + location.origin + '）。请确认后端已启动，然后刷新重试。';
}

function maybeLocalFileTip(){
  if (location.protocol !== 'file:') return;
  const tip = $('localTip');
  if (!tip) return;
  const url = API_ORIGIN + '/merchant';
  tip.innerHTML = '⚠️ 你正在<b>直接打开本地文件</b>（file://）。Safari 会拦截此方式对后端的请求，' +
    '从而出现 “Load failed”。请点这里用后端地址打开：<a href="' + esc(url) + '">' + esc(url) + '</a>';
  tip.style.display = 'block';
}
function toast(msg, isErr){
  const wrap = $('toastWrap');
  const el = document.createElement('div');
  el.className = 'toast' + (isErr ? ' err' : '');
  el.textContent = msg;
  wrap.appendChild(el);
  requestAnimationFrame(() => el.classList.add('show'));
  setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 300); }, 2600);
}
function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace( />/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function imgUrl(name){ return API_ORIGIN + '/images/' + encodeURIComponent(name); }
function previewLightbox(url){
  let ov = document.getElementById('imgLightbox');
  if (!ov){
    ov = document.createElement('div');
    ov.id = 'imgLightbox';
    ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.82);display:flex;align-items:center;justify-content:center;z-index:9999;cursor:zoom-out;';
    ov.onclick = function(){ ov.remove(); };
    document.body.appendChild(ov);
  }
  ov.innerHTML = '<img src="' + esc(url) + '" style="max-width:92vw;max-height:92vh;border-radius:10px;" />';
}

function syncKnowledgeBase(action, product){
  try {
    fetch(API + '/knowledge/update', {
      method: 'POST',
      headers: Object.assign({ 'Content-Type': 'application/json' },

async function submitAuth(){
  const tip = $('authTip');
  tip.classList.remove('ok');
  tip.textContent = '';
  const btn = $('authSubmit');
  btn.disabled = true;
  try {
    if (authTab === 'register'){
      const username = $('regUsername').value.trim();
      const password = $('regPassword').value;
      const password2 = $('regPassword2').value;
      const name = $('regName').value.trim();
      const shop = $('regShop').value.trim();
      if (!username || !password || !name){ tip.textContent = '请填写用户名、密码与姓名'; return; }
      if (!/^[A-Za-z0-9]{6,}$/.test(password)){
        tip.textContent = '密码至少 6 位，且只能包含字母和数字（不允许特殊字符）'; return;
      }
      if (password !== password2){ tip.textContent = '两次输入的密码不一致'; return; }
      const reg = await api('POST', '/register', {
        username, password, password2, name, shop_name: shop
      });
      tip.classList.add('ok');
      tip.textContent = reg.message || '注册申请已提交，请等待平台客服审核';
      // 注册后不再自动登录：必须等平台客服在「商户审核」里确认通过
      setAuthTab('login');
      $('loginUsername').value = username;
      return;
    }
    const username = $('loginUsername').value.trim();
    const password = $('loginPassword').value;
    if (!username || !password){ tip.textContent = '请输入用户名和密码'; return; }
    const data = await api('POST', '/login', { username, password });
    setToken(data.token);
    merchant = data.merchant;
    toast('欢迎回来，' + (merchant.shop_name || merchant.name));
    showApp();
    await initData();
  } catch (e) {
    tip.classList.remove('ok');
    tip.textContent = e.message;
  } finally {
    btn.disabled = false;
  }
}

function renderInv(p){

    box.innerHTML = '<div class="empty">该商品暂无规格，请先在「编辑」中添加规格</div>';
    return;
  }
  box.innerHTML = invSkus.map(s => {

        '<div class="inv-stats">可售 ' + avail + ' · 预占 ' + locked + ' · 已售 ' + sold + ' · 实物 ' + stock + '</div>' +
      '</div>' +

        '<button class="btn btn-ghost btn-sm" onclick="invAdjust(\'' + esc(s.sku_id) + '\', -1)">−1</button>' +

        '<input class="inp inv-input" id="inv_' + esc(s.sku_id) + '" type="number" min="0" step="1" value="' + stock + '" title="设置实物库存（不能低于已预占 ' + locked + ' 件）">' +

function invAdjust(sku, delta){
  const el = $('inv_' + sku);
  if (!el) return;
  let v = parseInt(el.value || '0', 10) || 0;
  v = Math.max(0, v + delta);
  el.value = v;
}
async function saveInv(){
  if (!invPid) return;
  const stocks = {};

    const el = $('inv_' + s.sku_id);

  btn.classList.add('loading'); btn.disabled = true;
  try {

function handleImages(input){
  const files = Array.from(input.files || []);
  input.value = '';
  if (!files.length) return;
  uploadFiles(files);
}
async function uploadFiles(files){
  uploading++;
  for (const file of files){
    if (!file.type.startsWith('image/')) continue;
    const fd = new FormData();
    fd.append('file', file);
    try {
      let res;
      try {
        res = await fetch(API + '/upload', {
          method: 'POST',
          headers: token ? { 'Authorization': 'Bearer ' + token } : {},
          body: fd
        });
      } catch (netErr) {
        throw new Error(networkHint());
      }
      const data = await res.json();
      if (!res.ok || !data.ok) throw new Error(data.error || '上传失败');
      editingImages.push(data.filename);
      renderImages();
    } catch (e) {
      toast('图片上传失败：' + e.message, true);
    }
  }
  uploading--;
  if (uploading === 0) toast('图片已上传');
}
function bindDrag(){
  const grid = $('imgGrid');
  ['dragenter','dragover'].forEach(ev => grid.addEventListener(ev, e => {
    e.preventDefault();
    const add = $('imgAdd'); if (add) add.classList.add('drag');
  }));
  ['dragleave','drop'].forEach(ev => grid.addEventListener(ev, e => {
    e.preventDefault();
    const add = $('imgAdd'); if (add) add.classList.remove('drag');
  }));
  grid.addEventListener('drop', e => {
    const files = Array.from(e.dataTransfer.files || []).filter(f => f.type.startsWith('image/'));
    if (files.length) uploadFiles(files);
  });
}

async function saveProduct(){

  if (!name){ toast('请填写商品名称', true); $('fName').focus(); return; }
  const payload = {
    name,
    tag: $('fTag').value.trim(),
    price: Number($('fPrice').value) || 0,
    desc: $('fDesc').value.trim(),
    images: editingImages.slice(),
    specs: collectSpecs()
  };
  const btn = $('btnSave');
  btn.classList.add('loading'); btn.disabled = true;
  try {
    let data;
    if (editingId){
      data = await api('PUT', '/products/' + encodeURIComponent(editingId), payload);
      const idx = products.findIndex(x => x.id === editingId);
      if (idx >= 0) products[idx] = data.product;
    } else {
      data = await api('POST', '/products', payload);
      products.push(data.product);
    }
    categories = Array.from(new Set(products.map(p => p.tag).filter(Boolean)));
    updateCatOptions();
    renderList();

function rangeToSinceUntil(range){
  if (!range) return { since: '', until: '' };
  const now = new Date();
  const day = function(offset){
    const d = new Date(now.getTime() - offset * 86400000);
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') +
           '-' + String(d.getDate()).padStart(2, '0');
  };
  const today = day(0);
  if (range === 'today') return { since: today + ' 00:00:00', until: today + ' 23:59:59' };
  if (range === '7d')    return { since: day(6) + ' 00:00:00',  until: today + ' 23:59:59' };
  if (range === '30d')   return { since: day(29) + ' 00:00:00', until: today + ' 23:59:59' };
  return { since: '', until: '' };
}

let lastHumanCount = 0;
let lastPlatformHuman = 0;
let lastAwaitingCount = 0;
let lastUnreadTotal = 0;

function updateHumanAlert(platformHuman){
  const banner = $('alertBanner');
  if (!banner) return;
  if (!token){
    banner.classList.remove('show', 'calm');
    banner.innerHTML = '';
    lastHumanCount = 0;
    lastPlatformHuman = 0;
    lastAwaitingCount = 0;
    lastUnreadTotal = 0;
    return;
  }
  
  const pending = conversations.filter(c => c.needs_human && !c.human_ack);
  const total = pending.length;
  const platform = Number(platformHuman) || 0;
  // 顾客来消息但商家还没真人回复：即使点开会话清了未读，横幅仍提醒及时回复
  const awaiting = conversations.filter(c => c.awaiting_reply && !c.needs_human).length;
  const unreadTotal = conversations.reduce((s, c) => s + (Number(c.unread_merchant) || 0), 0);
  // 只要顾客表达过退换货意向就持续提醒（return_intent 长期保留，直到商家「标记已处理」才撤下）
  const intentPending = conversations.filter(c => c.return_intent).length;
  const mainText = total > 0
    ? '⚠️ 有 ' + total + ' 位顾客在等你人工回复'
    : (awaiting > 0 ? '💬 有 ' + awaiting + ' 位顾客在等你回复，请及时回复'
                    : (unreadTotal > 0 ? '💬 有 ' + unreadTotal + ' 条顾客新消息，请及时回复' : ''));
  const subs = [];
  if (intentPending > 0) subs.push('其中 ' + intentPending + ' 位顾客表达了退换货/退款意向，请优先跟进（点开会话可「标记已处理」）');
  if (platform > 0) subs.push('另有 ' + platform + ' 条售后转人工，由平台客服处理');
  const subsHtml = subs.map(t => '<span class="sub">' + esc(t) + '</span>').join('');

  if (mainText){
    
    banner.classList.remove('calm');
    banner.onclick = goPendingHuman;
    banner.innerHTML = mainText + subsHtml;
    banner.classList.add('show');
  } else if (platform > 0){
    
    banner.classList.add('calm');
    banner.onclick = null;
    banner.innerHTML = '有 ' + platform + ' 条售后转人工，正在由平台客服处理' +
      '<span class="sub">你无需处理，平台客服接手后会自动消失</span>';
    banner.classList.add('show');
  } else {
    banner.classList.remove('show', 'calm');
    banner.onclick = goPendingHuman;
    banner.innerHTML = '';
  }

  
  // 新增待回复会话 / 新增未读消息时提示一次，避免轮询重复响
  if (total > lastHumanCount || awaiting > lastAwaitingCount || unreadTotal > lastUnreadTotal) beepAlert();
  lastHumanCount = total;
  lastPlatformHuman = platform;
  lastAwaitingCount = awaiting;
  lastUnreadTotal = unreadTotal;
}

function goPendingHuman(){
  // 优先跳到「有退换货意向且还没回复」的会话，其次待人工，再次待回复 / 未读
  const target = conversations.find(c => c.return_intent_pending && c.awaiting_reply) ||
                 conversations.find(c => c.needs_human && !c.human_ack) ||
                 conversations.find(c => c.awaiting_reply) ||
                 conversations.find(c => Number(c.unread_merchant) > 0);
  switchView('chats');
  if (target) openChat(target.user_id, target.merchant_id);
}

function beepAlert(){
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    const ctx = new AC();
    [0, 0.24].forEach(function(offset, i){
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = i === 0 ? 880 : 1180;
      const t0 = ctx.currentTime + offset;
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(0.2, t0 + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.18);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(t0);
      osc.stop(t0 + 0.2);
    });
    setTimeout(function(){ ctx.close(); }, 900);
  } catch (e) { /* 静默：有的浏览器不允许自动播放 */ }
}

function shipOps(o, source){
  const pending = Number(o.status_step) === 0;
  if (pending){
    if (o.can_ship === false){
      return '<button class="btn btn-light btn-sm" disabled title="' + esc(o.ship_blocked_reason || '') + '">不可发货</button>';
    }
    const prefix = (source === 'chat' ? 'cship_' : 'oship_');
    const ph = (source === 'chat' ? '7位单号' : '7位快递单号');
    return '<input class="co-waybill" id="' + prefix + esc(o.order_id) + '" maxlength="7" placeholder="' + ph + '" ' +
             'onkeydown="if(event.key===\'Enter\'){event.preventDefault();shipOrder(\'' + esc(o.order_id) + '\',\'' + source + '\');}">' +
           '<button class="btn btn-primary btn-sm" onclick="shipOrder(\'' + esc(o.order_id) + '\',\'' + source + '\')">发货</button>';
  }
  return o.waybill
    ? '<button class="btn btn-ghost btn-sm" onclick="queryLogistics(\'' + esc(o.waybill) + '\')">' +
      (source === 'chat' ? '物流' : '查询物流') + '</button>'
    : '';
}
function messagesHtml(msgs){
  if (!msgs || !msgs.length) return '<div class="chat-placeholder">还没有消息</div>';
  return msgs.map(m => {
    const cls = m.role === 'merchant' ? 'merchant' : (m.role === 'bot' ? 'bot' : 'user');

    // 已读回执只给发送方看：商家只对自己发出的消息显示「已读 / 未读」；
    // 顾客 / 平台管理员 / 机器人发来的消息属于接收方一侧，这里一律不显示。
    const readLabel = (m.role === 'merchant')
      ? '<span class="msg-read">' + (m.read_user ? '已读' : '未读') + '</span>'
      : '';
    const imgs = Array.isArray(m.images) ? m.images : [];
    const imgHtml = imgs.length
      ? '<div class="chat-msg-imgs">' + imgs.map(u =>
          '<img src="' + esc(u) + '" onclick="previewLightbox(\'' + esc(u) + '\')" alt="图片" />'
        ).join('') + '</div>'
      : '';
    const textHtml = m.text ? esc(m.text) : (imgs.length ? '' : '');
    return '<div class="msg ' + cls + '">' +
      textHtml + imgHtml + '<span class="t">' + esc(m.time || '') + '</span>' +
      readLabel + '</div>';
  }).join('');
}
function msgSig(msgs){

  return msgs.length + ':' + msgs.map(m =>
    (m.read_user ? 1 : 0) + '' + (m.read_merchant ? 1 : 0) +
    (Array.isArray(m.images) ? m.images.length : 0)).join('');
}

          '<button class="btn btn-primary" onclick="sendReply()">发送</button>' +

function refreshChatMessages(thread){
  const box = $('chatMsgs');
  if (!box){ renderChatThread(thread); return; }
  // 顾客表达过退换货意向的会话：提醒条持续显示，直到商家「标记已处理」才撤下
  const tip = $('chatIntentTip');
  const keep = !!(thread && thread.return_intent);
  if (tip && !keep) tip.remove();
  if (!tip && keep){
    const head = box.parentNode ? box.parentNode.querySelector('.chat-head') : null;
    if (head) head.insertAdjacentHTML('afterend', intentTipHtml(thread));
  }
  const msgs = (thread && thread.messages) || [];
  const sig = msgSig(msgs);
  if (box.dataset.sig === sig) return;
  box.dataset.sig = sig;
  box.innerHTML = messagesHtml(msgs);
  box.scrollTop = box.scrollHeight;
}

    return;

  const input = $('replyInput');

  input.value = '';
  try {
    await api('POST', '/chats/reply', {
      user_id: activeChat.user_id,
      merchant_id: activeChat.merchant_id,
      text: text

    const data = await api('GET', '/chats/thread?user_id=' + encodeURIComponent(activeChat.user_id) +
      '&merchant_id=' + encodeURIComponent(activeChat.merchant_id));

    toast('发送失败：' + e.message, true);

}

    api('GET', '/chats/thread?user_id=' + encodeURIComponent(activeChat.user_id) +
        '&merchant_id=' + encodeURIComponent(activeChat.merchant_id))
      .then(data => { refreshChatMessages(data.thread); loadConversations(false); })
      .catch(() => {});
    loadChatOrders(activeChat.user_id, true);
  }, 4000);
}
function stopChatPolling(){
  if (chatTimer){ clearInterval(chatTimer); chatTimer = null; }
}

function statCard(label, value){
  return '<div class="stat-card"><div class="k">' + esc(label) +
         '</div><div class="v">' + value + '</div></div>';
}

function closeStats(){
  const d = $('statsDrawer'), m = $('statsMask');
  if (d) d.classList.remove('open');
  if (m) m.classList.remove('open');
  statsProductId = null;
}

async function openStats(id){
  statsProductId = id;
  $('statsTitle').textContent = '商品数据';
  $('statsBody').innerHTML = '<div class="empty" style="background:transparent;border:none">正在加载…</div>';
  $('statsDrawer').classList.add('open');
  $('statsMask').classList.add('open');
  try {
    const data = await api('GET', '/products/' + encodeURIComponent(id) + '/orders');
    renderStats(data);
  } catch (e) {
    $('statsBody').innerHTML = '<div class="empty">加载失败：' + esc(e.message) + '</div>';
  }
}

function renderStats(data){
  const p = data.product || {};
  const buyers = data.buyers || [];
  $('statsTitle').textContent = (p.name || '商品') + ' · 数据';

  let html = '<div class="stats-grid">' +
    statCard('浏览量', Number(p.views) || 0) +
    statCard('销量', (Number(p.sales) || 0) + ' 件') +
    statCard('订单数', Number(p.order_count) || 0) +
    statCard('买家数', Number(p.buyer_count) || 0) +
    statCard('销售额', '¥' + fmtPrice(p.sales_amount)) +
    statCard('单价', '¥' + fmtPrice(p.price)) +
  '</div>';

  html += '<h3 class="stats-h3">购买顾客（' + buyers.length + '）</h3>';
  if (!buyers.length){
    html += '<div class="empty">还没有顾客下单</div>';
  } else {
    html += buyers.map(function(b){
      const orders = (b.orders || []).map(function(o){
        return '<div class="b-order">' +
          '<span>订单 ' + esc(o.order_id || '—') + '</span>' +
          '<span>×' + (o.quantity || 1) + '</span>' +
          '<span class="status-pill gray">' + esc(o.status_text || '') + '</span>' +
          '<span>运单 ' + esc(o.waybill || '—') + '</span>' +
          (o.waybill ? '<button class="btn btn-ghost btn-sm" onclick="queryLogistics(\'' + esc(o.waybill) + '\')">查询物流</button>' : '') +
        '</div>';
      }).join('');
      return '<div class="buyer">' +
        '<div class="buyer-head">' +
          '<span class="buyer-name">' + esc(b.user_name || ('顾客 ' + (b.user_id || ''))) + '</span>' +
          '<span class="buyer-meta">购买 ' + (b.count || 0) + ' 次 · 共 ' + (b.quantity || 0) + ' 件 · ¥' + fmtPrice(b.amount) + '</span>' +
        '</div>' + orders +
      '</div>';
    }).join('');
  }
  $('statsBody').innerHTML = html;
}

async function loadMerchantOrders(manual){
  try {
    const q = orderFilter ? ('?status=' + encodeURIComponent(orderFilter)) : '';
    const data = await api('GET', '/orders' + q);
    merchantOrders = data.orders || [];
    renderMerchantOrders();
    updateOrderBadge(data.stats || {});
    if (manual) toast('已刷新');
  } catch (e) {
    if (manual) toast('加载失败：' + e.message, true);
  }
}

function updateOrderBadge(stats){
  const badge = $('orderBadge');
  if (!badge) return;
  const pending = Number(stats.pending != null
    ? stats.pending
    : merchantOrders.filter(o => Number(o.status_step) === 0).length);
  if (pending > 0){ badge.style.display = 'inline-block'; badge.textContent = pending; }
  else badge.style.display = 'none';
}

function setOrderFilter(btn){
  orderFilter = btn.dataset.status || '';
  document.querySelectorAll('#orderFilterGroup .chip').forEach(c => c.classList.toggle('active', c === btn));
  loadMerchantOrders(false);
}

function orderStatusClass(step){
  step = Number(step) || 0;
  if (step === 0) return 'orange';
  if (step >= 4) return 'green';
  return 'blue';
}

function renderMerchantOrders(){
  const box = $('merchantOrderList');
  if (!box) return;
  if (!merchantOrders.length){
    const tip = orderFilter === 'pending' ? '暂无待发货订单'
              : (orderFilter === 'shipped' ? '暂无已发货订单' : '暂无订单');
    box.innerHTML = '<div class="empty">' + tip + '</div>';
    return;
  }
  box.innerHTML = merchantOrders.map(function(o){
    const ops = shipOps(o, 'orders');
    return '<div class="order-card">' +
      '<div class="oc-main">' +
        '<div class="oc-title">' + esc(o.goodsname || '') + ' ×' + (o.quantity || 1) + '</div>' +
        '<div class="oc-meta">订单号：' + esc(o.order_id || '—') + '　下单时间：' + esc(o.create_time || '—') + '　金额：¥' + fmtPrice(o.amount) + '</div>' +
        '<div class="ship-info">' +
          '<div class="si-row"><span class="si-k">收货人</span><span class="si-v">' + esc(o.user_name || o.user_id || '—') + '</span>' +
            '<span class="si-k">电话</span><span class="si-v">' + esc(o.phone || '—') + '</span></div>' +
          '<div class="si-row"><span class="si-k">收货地址</span><span class="si-v addr">' + esc(o.address || '—') + '</span></div>' +
        '</div>' +
        '<div class="oc-meta">运单号：' + esc(o.waybill || '待填写') + '</div>' +
        (o.ship_blocked_reason ? '<div class="oc-meta" style="color:#b25000">' + esc(o.ship_blocked_reason) + '</div>' : '') +
      '</div>' +
      '<div class="oc-ops">' +
        '<span class="status-pill ' + orderStatusClass(o.status_step) + '">' + esc(o.status_text || '') + '</span>' + ops +
      '</div>' +
    '</div>';
  }).join('');
}

async function shipOrder(orderId, source){
  const input = $((source === 'chat' ? 'cship_' : 'oship_') + orderId);
  const waybill = (input ? input.value : '').trim();
  if (!/^\d{7}$/.test(waybill)){ toast('快递单号必须是 7 位数字', true); return; }
  
  const list = (source === 'chat') ? chatOrdersData : merchantOrders;
  const o = (list || []).find(function(x){ return x.order_id === orderId; });
  if (o){
    const ok = confirm('确认发货？请核对收货信息：\n\n' +
      '收货人：' + (o.user_name || o.user_id || '—') + '\n' +
      '电话：' + (o.phone || '—') + '\n' +
      '地址：' + (o.address || '—') + '\n' +
      '运单号：' + waybill);
    if (!ok) return;
  }
  try {
    const data = await api('POST', '/orders/' + encodeURIComponent(orderId) + '/ship', { waybill: waybill });
    toast(data.message || '已发货');
    await loadMerchantOrders(false);
    if (activeChat) loadChatOrders(activeChat.user_id, false);
  } catch (e) {
    toast('发货失败：' + e.message, true);
  }
}

function startOrderPolling(){
  stopOrderPolling();
  orderTimer = setInterval(function(){
    const view = $('view-orders');
    if (view && view.classList.contains('active')) loadMerchantOrders(false);
  }, 8000);
}

function stopOrderPolling(){
  if (orderTimer){ clearInterval(orderTimer); orderTimer = null; }
}

async function queryLogistics(waybill){
  const input = $('logiInput');
  const code = String(waybill || (input ? input.value : '') || '').trim();
  if (!code){ toast('请输入运单号', true); return; }
  if (input) input.value = code;
  openLogiModal();
  const sub = $('logiSub');
  if (sub) sub.textContent = '运单号 ' + code;
  const box = $('logiModalBody');
  if (box) box.innerHTML = '<div class="empty" style="margin-top:10px">正在查询物流…</div>';
  try {
    const data = await api('GET', '/logistics?waybill=' + encodeURIComponent(code));
    renderLogistics(data.logistics || {});
  } catch (e) {
    if (box) box.innerHTML = '<div class="empty" style="margin-top:10px">' + esc(e.message) + '</div>';
  }
}

function openLogiModal(){
  const mask = $('logiMask'), modal = $('logiModal');
  if (mask) mask.classList.add('open');
  if (modal) modal.classList.add('open');
}

function closeLogiModal(){
  const mask = $('logiMask'), modal = $('logiModal');
  if (mask) mask.classList.remove('open');
  if (modal) modal.classList.remove('open');
}

const LOGI_STEPS = ['已下单', '已发货', '运输中', '派送中', '已签收'];

function renderLogistics(l){
  const box = $('logiModalBody');
  if (!box) return;
  const step = Number(l.status_step) || 0;
  const steps = LOGI_STEPS.map(function(t, i){
    const cls = i < step ? 'done' : (i === step ? 'cur' : '');
    return '<div class="s ' + cls + '"><div class="bar"></div>' + esc(t) + '</div>';
  }).join('');
  box.innerHTML =
    '<div class="logi-card" style="margin-top:0">' +
      '<div class="row-line"><span class="k">运单号</span><span>' + esc(l.waybill || '—') + '</span></div>' +
      '<div class="row-line"><span class="k">物流公司</span><span>' + esc(l.carrier || '—') + '</span></div>' +
      '<div class="row-line"><span class="k">收货地址</span><span>' + esc(l.address || '—') + '</span></div>' +
      '<div class="row-line"><span class="k">发货时间</span><span>' + esc(l.shipped_at || '—') + '</span></div>' +
      '<div class="row-line"><span class="k">预计送达</span><span>' + esc(l.estimated_arrival || '—') + '</span></div>' +
      '<div class="row-line"><span class="k">当前状态</span><span><b>' + esc(l.status_text || '—') + '</b></span></div>' +
      '<div class="steps">' + steps + '</div>' +
    '</div>';
}

const REFUND_STATUS_CLASS = {
  requested: 'blue', approved: 'blue', pending: 'blue',
  returning: 'orange', delivering: 'orange', shipping: 'orange',
  received: 'orange', refunded: 'green', done: 'green', rejected: 'gray'
};
const REFUND_NEXT_LABEL = {
  requested: '退回中', returning: '派送中', delivering: '商家签收', received: '已退款'
};

async function loadRefunds(manual){
  try {
    const data = await api('GET', '/refunds');
    refunds = data.refunds || [];
    renderRefunds();
    updateRefundBadge();
    if (manual) toast('已刷新');
  } catch (e) {
    if (manual) toast('加载失败：' + e.message, true);
  }
}

function updateRefundBadge(){
  
  const pending = refunds.filter(function(r){
    return r.status_code === 'requested'
      || (r.type === 'exchange' && r.status_code === 'received');
  }).length;
  const badge = $('refundBadge');
  if (!badge) return;
  if (pending > 0){ badge.style.display = 'inline-block'; badge.textContent = pending; }
  else badge.style.display = 'none';
}

function renderRefunds(){
  const box = $('refundList');
  if (!box) return;
  if (!refunds.length){
    box.innerHTML = '<div class="empty"><div class="t">暂无售后申请</div>' +
      '顾客在客户前端「我的订单」或售后客服中申请退货 / 换货 / 退款后会显示在这里</div>';
    return;
  }
  box.innerHTML = refunds.map(function(r){
    const code = r.status_code || 'requested';
    const cls = REFUND_STATUS_CLASS[code] || 'gray';
    const nextLabel = REFUND_NEXT_LABEL[code];
    const isRefund = r.type === 'refund';
    const isExchange = r.type === 'exchange';
    let ops = '';
    if (code === 'requested'){
      if (isRefund){
        ops =
          '<button class="btn btn-primary btn-sm" onclick="setRefundStatus(\'' + esc(r.id) + '\',\'returning\')">同意退款</button>' +
          '<button class="btn btn-danger btn-sm" onclick="setRefundStatus(\'' + esc(r.id) + '\',\'rejected\')">拒绝</button>';
      } else {
        ops =
          '<button class="btn btn-primary btn-sm" onclick="setRefundStatus(\'' + esc(r.id) + '\',\'approved\')">同意申请</button>' +
          '<button class="btn btn-danger btn-sm" onclick="setRefundStatus(\'' + esc(r.id) + '\',\'rejected\')">拒绝</button>';
      }
    } else if (isExchange && (code === 'shipping' || code === 'received')){
      
      ops =
        '<input class="co-waybill" id="reship_' + esc(r.id) + '" maxlength="7" placeholder="7位新单号" ' +
          'onkeydown="if(event.key===\'Enter\'){event.preventDefault();reshipExchange(\'' + esc(r.id) + '\');}">' +
        '<button class="btn btn-primary btn-sm" onclick="reshipExchange(\'' + esc(r.id) + '\')">签收并重新发货</button>';
    } else if (isRefund && nextLabel){
      ops = '<button class="btn btn-light btn-sm" onclick="setRefundStatus(\'' + esc(r.id) + '\',\'next\')">标记为' + esc(nextLabel) + '</button>';
    }
    if (r.original_waybill){
      ops += '<button class="btn btn-ghost btn-sm" onclick="queryLogistics(\'' + esc(r.original_waybill) + '\')">原单物流</button>';
    }
    const returnLine = r.return_waybill
      ? '<div class="rc-meta">' + (isExchange ? '顾客寄回单号：' : '平台退货单号：') +
        esc(r.return_waybill) + '</div>' : '';
    const reshipLine = r.reship_waybill
      ? '<div class="rc-meta">重新发货运单号：' + esc(r.reship_waybill) + '</div>' : '';
    const rejectLine = r.reject_reason
      ? '<div class="rc-meta">拒绝理由：' + esc(r.reject_reason) + '</div>' : '';
    const imgsLine = (Array.isArray(r.images) && r.images.length)
      ? '<div class="rc-meta">上传凭证：</div><div class="rc-imgs">' + r.images.map(u =>
          '<img src="' + esc(u) + '" onclick="previewLightbox(\'' + esc(u) + '\')" alt="凭证" />'
        ).join('') + '</div>'
      : '';
    return '<div class="refund-card">' +
      '<div class="rc-main">' +
        '<div class="rc-title">' + esc(r.type_text || '售后') + ' · ' + esc(r.goodsname || '') + ' ×' + (r.quantity || 1) + '</div>' +
        '<div class="rc-meta">顾客：' + esc(r.user_name || r.user_id || '—') + '　订单号：' + esc(r.order_id || '—') + '</div>' +
        '<div class="rc-meta">原运单：' + esc(r.original_waybill || '—') + '　申请时间：' + esc(r.create_time || '—') + '</div>' +
        returnLine +
        reshipLine +
        (r.reason ? '<div class="rc-meta">原因：' + esc(r.reason) + '</div>' : '') +
        imgsLine +
        rejectLine +
      '</div>' +
      '<div class="rc-ops">' +
        '<span class="status-pill ' + cls + '">' + esc(r.status_text || '') + '</span>' + ops +
      '</div>' +
    '</div>';
  }).join('');
}

async function reshipExchange(id){
  const input = $('reship_' + id);
  const waybill = (input ? input.value : '').trim();
  if (!/^\d{7}$/.test(waybill)){ toast('重新发货的快递单号必须是 7 位数字', true); return; }
  try {
    const data = await api('POST', '/refunds/' + encodeURIComponent(id) + '/reship', { waybill: waybill });
    toast(data.message || '已重新发货');
    await loadRefunds(false);
  } catch (e) {
    toast('重新发货失败：' + e.message, true);
  }
}

async function setRefundStatus(id, status){
  const body = { status: status };
  
  if (status === 'rejected'){
    const reason = prompt('请填写拒绝理由（顾客会看到，将作为平台仲裁的判定依据）：', '');
    if (reason === null) return;                    
    if (!reason.trim()){ toast('拒绝必须填写理由', true); return; }
    body.reject_reason = reason.trim();
  }
  try {
    const data = await api('POST', '/refunds/' + encodeURIComponent(id) + '/status', body);
    toast(data.message || '已更新');
    await loadRefunds(false);
  } catch (e) {
    toast('操作失败：' + e.message, true);
  }
}

function startRefundPolling(){
  stopRefundPolling();
  refundTimer = setInterval(function(){
    const view = $('view-refunds');
    if (view && view.classList.contains('active')) loadRefunds(false);
  }, 6000);
}

function stopRefundPolling(){
  if (refundTimer){ clearInterval(refundTimer); refundTimer = null; }
}

boot();
</script>
<script src="i18n/core.js"></script>
<script src="i18n/merchant.js"></script>
</body>
</html>
